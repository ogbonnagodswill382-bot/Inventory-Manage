services:
  - type: web
    name: stockflow-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn stockflow_backend.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_HOSTS
        value: "*"

